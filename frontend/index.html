<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SmartCare - Hospital Management System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .triage-critical { background-color: #fee2e2; color: #991b1b; border: 1px solid #f87171; }
    .triage-high     { background-color: #ffedd5; color: #9a3412; border: 1px solid #fb923c; }
    .triage-medium   { background-color: #fef9c3; color: #854d0e; border: 1px solid #facc15; }
    .triage-low      { background-color: #dcfce7; color: #166534; border: 1px solid #4ade80; }
  </style>
</head>
<body class="bg-[#f0fdfa] text-slate-800 font-sans antialiased min-h-screen flex flex-col">

  <header class="bg-teal-800 text-white shadow-md sticky top-0 z-40">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between items-center h-16">
      <div class="flex items-center space-x-3">
        <div class="w-10 h-10 rounded-lg bg-[#00796b] flex items-center justify-center text-xl font-bold shadow"><i class="fa-solid fa-hospital-user"></i></div>
        <div>
          <span class="text-xl font-bold tracking-wide">SmartCare</span>
          <span class="text-xs block text-teal-200">आरोग्यं परमं भाग्यम्</span>
        </div>
      </div>
      
      <div class="flex items-center space-x-4">
        <div class="flex items-center space-x-2 text-sm bg-teal-900/60 px-3 py-1.5 rounded-full border border-teal-700">
          <span class="text-teal-300 font-medium text-xs uppercase tracking-wider">Role:</span>
          <select id="role-selector" onchange="switchRole(this.value)" class="bg-transparent text-white font-semibold focus:outline-none cursor-pointer">
            <option value="Admin" class="text-slate-800">Admin</option>
            <option value="Doctor" class="text-slate-800">Doctor</option>
            <option value="Receptionist" class="text-slate-800">Receptionist</option>
            <option value="Patient" class="text-slate-800">Patient</option>
          </select>
        </div>
        <div class="flex items-center space-x-2 text-xs text-teal-200">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span>Online</span>
        </div>
      </div>
    </div>
  </header>

  <div class="flex-1 max-w-7xl w-full mx-auto px-4 sm:px-6 lg:px-8 py-6 flex gap-6">
    <aside class="w-64 bg-white rounded-xl shadow-sm border border-slate-200 p-4 shrink-0 flex flex-col justify-between">
      <div>
        <div class="text-xs font-semibold text-slate-400 uppercase tracking-wider px-3 mb-2">Hospital Modules</div>
        <nav class="space-y-1" id="nav-links"></nav>
      </div>

      <div class="p-3 bg-teal-50 border border-teal-100 rounded-lg text-xs text-teal-900">
        <p class="font-bold flex items-center gap-1.5 mb-1 text-teal-700">
          <i class="fa-solid fa-shield-halved"></i> Access Level
        </p>
        <p id="role-description" class="text-slate-600 leading-relaxed"></p>
      </div>
    </aside>

    <main class="flex-1 bg-white rounded-xl shadow-sm border border-slate-200 p-6 overflow-hidden flex flex-col" id="workspace">
    </main>
  </div>

  <script>
    const API = 'http://localhost:8080/api';
    let currentRole = 'Admin';
    let currentView = 'patients';

    const modules = [
      { id: 'patients', label: 'Patient Management', icon: 'fa-user-injured', roles: ['Admin', 'Receptionist', 'Doctor', 'Patient'] },
      { id: 'doctors', label: 'Doctor Management', icon: 'fa-user-doctor', roles: ['Admin', 'Receptionist', 'Doctor'] },
      { id: 'appointments', label: 'Appointments', icon: 'fa-calendar-check', roles: ['Admin', 'Receptionist', 'Doctor', 'Patient'] },
      { id: 'emergencies', label: 'Emergency & Triage', icon: 'fa-truck-medical', roles: ['Admin', 'Receptionist', 'Doctor'] },
      { id: 'beds', label: 'Beds & ICU Allocation', icon: 'fa-bed-pulse', roles: ['Admin', 'Receptionist', 'Doctor'] },
      { id: 'pharmacy', label: 'Pharmacy & Meds', icon: 'fa-pills', roles: ['Admin', 'Doctor'] },
      { id: 'lab', label: 'Laboratory Tests', icon: 'fa-flask-vial', roles: ['Admin', 'Doctor', 'Patient'] },
      { id: 'billing', label: 'Billing & Payments', icon: 'fa-file-invoice-dollar', roles: ['Admin', 'Receptionist', 'Patient'] },
      { id: 'discharges', label: 'Discharge Records', icon: 'fa-hospital-user', roles: ['Admin', 'Doctor', 'Receptionist'] },
      { id: 'ambulances', label: 'Ambulance Fleet', icon: 'fa-ambulance', roles: ['Admin', 'Receptionist'] }
    ];

    const roleInfo = {
      Admin: 'Full access to all 10 hospital operational modules, registries, and beds.',
      Doctor: 'Clinical operations: assigned patients, appointments, pharmacy, and laboratory.',
      Receptionist: 'Front-desk operations: registrations, doctor schedules, emergency triage, and billing.',
      Patient: 'Self-service portal: view personal health profile, upcoming appointments, and bills.'
    };

    function switchRole(role) {
      currentRole = role;
      document.getElementById('role-description').innerText = roleInfo[role];
      renderNavigation();
      const validModules = modules.filter(m => m.roles.includes(currentRole));
      if (!validModules.some(m => m.id === currentView)) {
        currentView = validModules[0].id;
      }
      renderView(currentView);
    }

    function renderNavigation() {
      const nav = document.getElementById('nav-links');
      const filtered = modules.filter(m => m.roles.includes(currentRole));
      nav.innerHTML = filtered.map(m => `
        <button onclick="renderView('${m.id}')" class="w-full flex items-center space-x-3 px-3 py-2.5 rounded-lg text-sm font-medium transition ${currentView === m.id ? 'bg-teal-50 text-teal-800 font-semibold border-l-4 border-teal-600' : 'text-slate-600 hover:bg-slate-100'}">
          <i class="fa-solid ${m.icon} w-5 text-center ${currentView === m.id ? 'text-teal-700' : 'text-slate-400'}"></i>
          <span>${m.label}</span>
        </button>
      `).join('');
    }

    async function renderView(viewId) {
      currentView = viewId;
      renderNavigation();
      const workspace = document.getElementById('workspace');
      workspace.innerHTML = '<div class="text-slate-400 p-8 text-center"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-[#00695c] mb-2"></i><p>Loading module...</p></div>';

      try {
        const res = await fetch(`${API}/${viewId}`);
        const data = await res.json();

        if (viewId === 'patients') {
          workspace.innerHTML = `
            <div class="flex justify-between items-center mb-6">
              <div>
                <h2 class="text-2xl font-bold text-slate-800">Patient Directory</h2>
                <p class="text-sm text-slate-500">Live records from C++ Storage Engine (${data.length} registered)</p>
              </div>
              <button onclick="downloadReport('${data[0]?.id || 'P-101'}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3.5 py-2 rounded-lg text-sm font-medium flex items-center gap-1.5 shadow-sm">
                <i class="fa-solid fa-file-pdf"></i> Download PDF Summary
              </button>
            </div>
            <div class="overflow-x-auto">
              <table class="w-full text-left text-sm border-collapse">
                <thead>
                  <tr class="border-b bg-[#f0fdfa] text-slate-600">
                    <th class="p-3">ID</th><th class="p-3">Full Name</th><th class="p-3">Age/Gender</th><th class="p-3">Contact</th><th class="p-3">Blood Group</th><th class="p-3">Address</th>
                  </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                  ${data.map(p => `
                    <tr class="hover:bg-[#f0fdfa]">
                      <td class="p-3 font-mono font-bold text-teal-800">${p.id}</td>
                      <td class="p-3 font-semibold text-slate-900">${p.name}</td>
                      <td class="p-3">${p.age} / ${p.gender}</td>
                      <td class="p-3">${p.contact}</td>
                      <td class="p-3"><span class="px-2 py-0.5 rounded bg-rose-100 text-rose-800 font-bold text-xs">${p.bloodGroup}</span></td>
                      <td class="p-3 text-slate-500">${p.address}</td>
                    </tr>
                  `).join('')}
                </tbody>
              </table>
            </div>
          `;
        } else if (viewId === 'emergencies') {
          workspace.innerHTML = `
            <div class="flex justify-between items-center mb-6">
              <div>
                <h2 class="text-2xl font-bold text-slate-800">Emergency & Triage Queue</h2>
                <p class="text-sm text-slate-500">4-Tier Priority Triage Matrix</p>
              </div>
            </div>
            <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">
              <div class="p-4 rounded-lg triage-critical font-medium text-sm flex items-center justify-between">
                <div><div class="font-bold text-base">Critical</div>Immediate</div>
                <i class="fa-solid fa-skull-crossbones text-2xl"></i>
              </div>
              <div class="p-4 rounded-lg triage-high font-medium text-sm flex items-center justify-between">
                <div><div class="font-bold text-base">High</div>Under 15 mins</div>
                <i class="fa-solid fa-triangle-exclamation text-2xl"></i>
              </div>
              <div class="p-4 rounded-lg triage-medium font-medium text-sm flex items-center justify-between">
                <div><div class="font-bold text-base">Medium</div>Under 60 mins</div>
                <i class="fa-solid fa-clock text-2xl"></i>
              </div>
              <div class="p-4 rounded-lg triage-low font-medium text-sm flex items-center justify-between">
                <div><div class="font-bold text-base">Low</div>Non-urgent</div>
                <i class="fa-solid fa-circle-check text-2xl"></i>
              </div>
            </div>
            <div class="space-y-3">
              ${data.map(emg => `
                <div class="p-4 rounded-xl border flex items-center justify-between ${emg.priority === 'Critical' ? 'triage-critical' : emg.priority === 'High' ? 'triage-high' : emg.priority === 'Medium' ? 'triage-medium' : 'triage-low'}">
                  <div>
                    <div class="font-bold text-base flex items-center gap-2">
                      <span>${emg.patientName} (${emg.age} yrs)</span>
                      <span class="text-xs font-mono uppercase bg-white/70 px-2 py-0.5 rounded border font-semibold">${emg.id}</span>
                    </div>
                    <div class="text-xs mt-1">Condition: <span class="font-medium">${emg.condition}</span> | Intake: ${emg.intakeTime}</div>
                  </div>
                  <span class="text-xs px-3 py-1 bg-white font-bold rounded-full shadow-sm">${emg.status}</span>
                </div>
              `).join('')}
            </div>
          `;
        } else if (viewId === 'beds') {
          workspace.innerHTML = `
            <div class="flex justify-between items-center mb-6">
              <div>
                <h2 class="text-2xl font-bold text-slate-800">Bed & ICU Occupancy</h2>
                <p class="text-sm text-slate-500">Live ward allocation tracker</p>
              </div>
            </div>
            <div class="grid grid-cols-2 md:grid-cols-4 gap-4">
              ${data.map(b => `
                <div class="p-4 rounded-xl border ${b.status === 'Available' ? 'bg-emerald-50/60 border-emerald-300' : 'bg-rose-50/60 border-rose-300'}">
                  <div class="flex justify-between items-start">
                    <span class="font-mono font-bold text-lg text-slate-800">${b.bedId}</span>
                    <span class="px-2 py-0.5 rounded text-xs font-semibold ${b.status === 'Available' ? 'bg-emerald-100 text-emerald-800' : 'bg-rose-100 text-rose-800'}">${b.status}</span>
                  </div>
                  <div class="mt-2 text-xs text-slate-500">Ward: <span class="font-medium text-slate-700">${b.wardType}</span></div>
                  <div class="text-xs text-slate-500">Occupant: <span class="font-medium text-slate-700">${b.patientId || 'None'}</span></div>
                </div>
              `).join('')}
            </div>
          `;
        } else {
          workspace.innerHTML = `
            <div class="flex justify-between items-center mb-6">
              <div>
                <h2 class="text-2xl font-bold text-slate-800">${modules.find(m => m.id === viewId)?.label}</h2>
                <p class="text-sm text-slate-500">Live REST records from /api/${viewId}</p>
              </div>
            </div>
            <pre class="bg-[#004d40] text-emerald-400 p-4 rounded-xl text-xs overflow-x-auto font-mono">${JSON.stringify(data, null, 2)}</pre>
          `;
        }
      } catch (err) {
        workspace.innerHTML = `<div class="p-6 bg-rose-50 text-rose-700 rounded-lg">Error connecting to आरोग्यं परमं भाग्यम् at ${API}</div>`;
      }
    }

    function downloadReport(patientId) {
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();
      doc.setFillColor(15, 118, 110);
      doc.rect(0, 0, 210, 25, 'F');
      doc.setTextColor(255, 255, 255);
      doc.setFontSize(16);
      doc.setFont('helvetica', 'bold');
      doc.text("SMARTCARE HOSPITAL MANAGEMENT SYSTEM", 14, 16);
      doc.setTextColor(51, 65, 85);
      doc.setFontSize(12);
      doc.text("Comprehensive Medical Record & Discharge Summary", 14, 38);
      doc.setDrawColor(203, 213, 225);
      doc.line(14, 42, 196, 42);
      doc.setFontSize(10);
      doc.setFont('helvetica', 'normal');
      doc.text(`Patient ID: ${patientId}`, 14, 50);
      doc.text("Patient Name: Rohan Sharma", 14, 57);
      doc.text("Age / Gender: 28 / Male", 14, 64);
      doc.text("Blood Group: O+", 14, 71);
      doc.text("Date of Admission: 2026-10-31", 120, 50);
      doc.text("Status: Stable / Discharged", 120, 57);
      doc.setFont('helvetica', 'bold');
      doc.text("Clinical Diagnosis & Findings:", 14, 85);
      doc.setFont('helvetica', 'normal');
      doc.text("Patient presented with acute fever and mild dehydration. Routine diagnostic evaluation completed.", 14, 92);
      doc.setFont('helvetica', 'bold');
      doc.text("Prescribed Medications:", 14, 105);
      doc.setFont('helvetica', 'normal');
      doc.text("- Paracetamol 650mg (TID for 3 days)", 20, 112);
      doc.text("- Oral Rehydration Salts (1 sachet daily)", 20, 119);
      doc.save(`SmartCare_Report_${patientId}.pdf`);
    }

    switchRole('Admin');
  </script>
</body>
</html>
